<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mielangelami Live</title>
  <style>
:root {
      --primary-color: #d97706;
      --primary-hover: #b45309;
      --bg-color: #fefce8;
      --chat-bg: #ffffff;
      --border-color: #fef08a;
      --text-main: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--chat-bg);
    }

    .chat-card {
      width: 100%;
      height: 100%;
      background: var(--chat-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: var(--primary-color);
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-header h2 {
      font-size: 1rem;
      font-weight: 600;
    }

    .chat-header .status {
      font-size: 0.75rem;
      opacity: 0.95;
    }

    .chat-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fafafa;
    }

    .auto-clean-notice {
      text-align: center;
      font-size: 0.7rem;
      color: #9ca3af;
      background: #f3f4f6;
      padding: 5px 10px;
      border-radius: 10px;
      margin-bottom: 4px;
    }

    .chat-bubble {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.35;
      word-break: break-word;
      display: flex;
      flex-direction: column;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      border: 1px solid rgba(0,0,0,0.05);
    }

    .chat-bubble.visitor {
      align-self: flex-start;
      color: #374151;
      border-bottom-left-radius: 2px;
    }

    .chat-bubble.staff {
      align-self: flex-end;
      background-color: #fef3c7;
      color: #78350f;
      border: 1px solid #fde68a;
      border-bottom-right-radius: 2px;
    }

    .msg-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.7rem;
      margin-bottom: 3px;
      opacity: 0.8;
      font-weight: 700;
    }

    .msg-text {
      white-space: pre-wrap;
    }

    .chat-footer {
      padding: 10px;
      background: white;
      border-top: 1px solid #f3f4f6;
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 18px;
      outline: none;
      font-size: 0.9rem;
    }

    .chat-input:focus {
      border-color: var(--primary-color);
    }

    .send-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .send-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="chat-card">
    <div class="chat-header">
      <span style="font-size: 1.5rem;">🐝</span>
      <div>
        <h2>Mielangelami Live</h2>
        <div class="status" id="user-badge">Inizializzazione...</div>
      </div>
    </div>

    <div class="chat-messages" id="chat-messages"></div>

    <form class="chat-footer" id="chat-form">
      <input 
        type="text" 
        id="chat-input" 
        class="chat-input" 
        placeholder="Scrivi un messaggio..." 
        autocomplete="off" 
        required
      />
      <button type="submit" class="send-btn" title="Invia">
        <svg viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
        </svg>
      </button>
    </form>
  </div>

  <script>
    const WORKER_URL = 'https://mielangelamichat.agosto.workers.dev';
    const messagesContainer = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const userBadge = document.getElementById('user-badge');

    // Calcola una sfumatura di giallo unica (HSL) basata sul nome
    function calcolaSfumaturaGiallo(nome) {
      let hash = 0;
      for (let i = 0; i < nome.length; i++) {
        hash = nome.charCodeAt(i) + ((hash << 5) - hash);
      }
      const hue = 42 + (Math.abs(hash) % 15);
      const saturation = 80 + (Math.abs(hash >> 2) % 20);
      const lightness = 78 + (Math.abs(hash >> 4) % 10);

      return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
    }

    // Generatore di nome casuale ape
    function generaNomeApe() {
      const ruoli = ['Operaia', 'Esploratrice', 'Nutrice', 'Guardiana', 'Architecta', 'Svolazzante', 'Melissera'];
      const ruolo = ruoli[Math.floor(Math.random() * ruoli.length)];
      const numero = Math.floor(Math.random() * 900) + 100;
      return `Ape ${ruolo} #${numero}`;
    }

    // Gestione Sessione Utente
    let mioNomeApe = sessionStorage.getItem('mioNomeApe');
    let mioColoreApe = sessionStorage.getItem('mioColoreApe');

    if (!mioNomeApe) {
      mioNomeApe = generaNomeApe();
      mioColoreApe = calcolaSfumaturaGiallo(mioNomeApe);
      sessionStorage.setItem('mioNomeApe', mioNomeApe);
      sessionStorage.setItem('mioColoreApe', mioColoreApe);
    }

    userBadge.textContent = `Tu sei: ${mioNomeApe}`;

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    async function caricaMessaggi() {
      try {
        const response = await fetch(WORKER_URL);
        if (!response.ok) return;

        const messages = await response.json();
        const isAtBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop <= messagesContainer.clientHeight + 50;

        messagesContainer.innerHTML = `
          <div class="auto-clean-notice">
            🧹 I messaggi si puliscono automaticamente ogni ora per tutelare la privacy.
          </div>
        `;

        messages.forEach(msg => {
          const isStaff = msg.type === 'staff';
          const bubble = document.createElement('div');
          bubble.className = `chat-bubble ${isStaff ? 'staff' : 'visitor'}`;
          
          const bgStyle = isStaff ? '' : `background-color: ${msg.colore || calcolaSfumaturaGiallo(msg.autore)};`;
          bubble.setAttribute('style', bgStyle);

          bubble.innerHTML = `
            <div class="msg-meta">
              <span>${escapeHtml(msg.autore)}</span>
              <span>${escapeHtml(msg.ora)}</span>
            </div>
            <div class="msg-text">${escapeHtml(msg.testo)}</div>
          `;
          
          messagesContainer.appendChild(bubble);
        });

        if (isAtBottom) {
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
      } catch (err) {
        console.error('Errore durante il recupero messaggi:', err);
      }
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const testo = chatInput.value.trim();
      if (!testo) return;

      chatInput.value = '';

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            messaggio: testo, 
            autore: mioNomeApe,
            colore: mioColoreApe
          })
        });

        if (res.ok) {
          await caricaMessaggi();
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
      } catch (err) {
        console.error('Errore di invio:', err);
      }
    });

    caricaMessaggi();
    setInterval(caricaMessaggi, 3000);
  </script>
</body>
</html>
