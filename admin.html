<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mielangelami | Pannello Gestione</title>
    <style>
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --bg: #fffbeb;
            --text: #451a03;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #fde68a;
            box-shadow: 0 10px 30px rgba(120, 53, 15, 0.08);
            width: 100%;
            max-width: 550px;
        }

        h2 {
            font-size: 1.5rem;
            color: var(--text);
            margin-bottom: 10px;
            text-align: center;
        }

        p.subtitle {
            font-size: 0.88rem;
            color: #78350f;
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-top: 15px;
            margin-bottom: 5px;
            color: var(--text);
        }

        input[type="text"], 
        input[type="password"], 
        textarea {
            width: 100%;
            padding: 11px;
            border: 2px solid #fcd34d;
            border-radius: 10px;
            background-color: #fffdf5;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--primary-dark);
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn-secondary {
            background-color: #d97706;
        }

        .btn-download {
            background-color: #059669;
        }

        .btn-download:hover {
            background-color: #047857;
        }

        .error-message {
            display: none;
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
        }

        .status-box {
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            background-color: #fef3c7;
            color: #92400e;
            border: 1px solid #fde68a;
        }

        .preview-list {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #fcd34d;
            border-radius: 10px;
            padding: 10px;
            background: #fffdf5;
        }

        .preview-item {
            padding: 8px;
            border-bottom: 1px solid #fde68a;
            font-size: 0.85rem;
        }

        .preview-item:last-child {
            border-bottom: none;
        }

        .preview-item strong {
            color: var(--primary-dark);
        }

        /* Gestione viste */
        #dashboardView {
            display: none;
        }
    </style>
</head>
<body>

    <!-- SCHERMATA LOGIN -->
    <div class="card" id="loginView">
        <h2>🍯 Area Riservata Admin</h2>
        <p class="subtitle">Inserisci le tue credenziali per gestire i Mielemessaggi</p>

        <form id="loginForm">
            <div>
                <label for="username">Nome Utente</label>
                <input type="text" id="username" placeholder="Es. agosto" required>
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div id="loginError" class="error-message">
                Credenziali errate! Controlla utente o password.
            </div>

            <button type="submit" class="btn">Accedi al Pannello 🔑</button>
        </form>
    </div>

    <!-- SCHERMATA DASHBOARD -->
    <div class="card" id="dashboardView">
        <h2>🐝 Gestione Mielemessaggi</h2>
        <p class="subtitle">Aggiungi nuovi messaggi al file JSON</p>
        
        <div id="statusBox" class="status-box">
            ⏳ Caricamento `testimonianze.json` in corso...
        </div>

        <div>
            <label for="autoreInput">1. Nome / Autore del messaggio:</label>
            <input type="text" id="autoreInput" placeholder="Es. Marco R. oppure Cliente Sostenitore 🐝">
        </div>

        <div>
            <label for="testoInput">2. Testo del Mielemessaggio:</label>
            <textarea id="testoInput" placeholder="Incolla il testo del messaggio ricevuto..."></textarea>
        </div>

        <button onclick="aggiungiMessaggio()" class="btn btn-secondary">+ Aggiungi alla lista ➕</button>

        <!-- Anteprima messaggi caricati/aggiunti -->
        <div>
            <label>Messaggi attualmente caricati (<span id="countMessaggi">0</span>):</label>
            <div class="preview-list" id="previewList">
                <p style="text-align: center; color: #78350f;">Nessun messaggio presente.</p>
            </div>
        </div>

        <button onclick="scaricaJson()" class="btn btn-download">Scarica testimonianze.json 📥</button>
    </div>

    <script>
        // LOGICA DI AUTENTICAZIONE FINTA
        const loginForm = document.getElementById('loginForm');
        const loginView = document.getElementById('loginView');
        const dashboardView = document.getElementById('dashboardView');
        const loginError = document.getElementById('loginError');
        const statusBox = document.getElementById('statusBox');

        let currentData = [];

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (user === 'agosto' && pass === 'mucca97') {
                loginError.style.display = 'none';
                loginView.style.display = 'none';
                dashboardView.style.display = 'block';
                
                // Carica automaticamente il JSON dopo il login
                caricaJsonIniziale();
            } else {
                loginError.style.display = 'block';
            }
        });

        // CARICAMENTO AUTOMATICO DEL FILE JSON
        async function caricaJsonIniziale() {
            // Prova prima in locale, poi eventualmente dall'URL assoluto
            const urlJSON = 'testimonianze.json'; // O puoi usare 'https://mielangelami.com/testimonianze.json'

            try {
                const response = await fetch(urlJSON, { cache: "no-store" });
                if (!response.ok) throw new Error("File non trovato");
                
                currentData = await response.json();
                statusBox.style.backgroundColor = "#d1fae5";
                statusBox.style.color = "#065f46";
                statusBox.style.borderColor = "#a7f3d0";
                statusBox.innerHTML = `✅ File caricato con successo! Presenti <strong>${currentData.length}</strong> messaggi.`;
            } catch (error) {
                console.warn("Impossibile caricare direttamente il JSON, creo un file vuoto.", error);
                statusBox.style.backgroundColor = "#fef2f2";
                statusBox.style.color = "#991b1b";
                statusBox.style.borderColor = "#fecaca";
                statusBox.innerHTML = `⚠️ Impossibile recuperare <code>testimonianze.json</code> automatico (CORS o file mancante). Inizieremo con una lista vuota o puoi aggiungere nuovi messaggi.`;
                currentData = [];
            }
            aggiornaAnteprima();
        }

        // AGGIUNGE UN MESSAGGIO ALLA LISTA IN MEMORIA
        function aggiungiMessaggio() {
            const testo = document.getElementById('testoInput').value.trim();
            const autore = document.getElementById('autoreInput').value.trim() || "Cliente Sostenitore 🐝";

            if (!testo) {
                alert("Inserisci prima il testo del messaggio!");
                return;
            }

            // Inserisce in cima alla lista
            currentData.unshift({ testo: testo, autore: autore });

            // Pulisce i campi di testo
            document.getElementById('testoInput').value = '';
            document.getElementById('autoreInput').value = '';

            aggiornaAnteprima();
        }

        // AGGIORNA L'ANTEPRIMA A SCHERMO
        function aggiornaAnteprima() {
            const previewList = document.getElementById('previewList');
            const countMessaggi = document.getElementById('countMessaggi');

            countMessaggi.innerText = currentData.length;

            if (currentData.length === 0) {
                previewList.innerHTML = '<p style="text-align: center; color: #78350f;">Nessun messaggio presente.</p>';
                return;
            }

            previewList.innerHTML = currentData.map((item) => `
                <div class="preview-item">
                    <strong>${escapeHtml(item.autore)}:</strong> "${escapeHtml(item.testo)}"
                </div>
            `).join('');
        }

        // SCARICA IL FILE JSON
        function scaricaJson() {
            if (currentData.length === 0) {
                alert("Non ci sono messaggi da scaricare!");
                return;
            }

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentData, null, 4));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "testimonianze.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();

            alert("File 'testimonianze.json' scaricato con successo!");
        }

        // Utility per evitare problemi con caratteri HTML speciali
        function escapeHtml(str) {
            return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : "";
        }
    </script>
</body>
</html>
