<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mielangelami | Il Miele Buono</title>
    <style>
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --bg: #fffbeb;
            --text: #451a03;
            --text-light: #78350f;
            --card-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .main-wrapper {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            justify-content: center;
            gap: 30px;
            max-width: 1300px;
            width: 100%;
            margin: auto;
        }

        .sidebar-left {
            flex: 0 0 380px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(120, 53, 15, 0.1);
            border: 2px solid #fef3c7;
        }

        .header-brand { text-align: center; margin-bottom: 25px; }
        .logo-container { width: 100px; height: 100px; margin: 0 auto 15px auto; animation: beeBuzz 4s ease-in-out infinite; }
        .logo-img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }

        @keyframes beeBuzz {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(0, -10px) rotate(5deg); }
        }

        h1 { font-size: 1.8rem; color: #451a03; font-weight: 800; }
        .tagline { font-size: 0.9rem; color: var(--text-light); font-weight: 600; }

        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 5px; }
        input[type="email"], textarea { width: 100%; padding: 12px; border: 2px solid #fcd34d; border-radius: 12px; background: #fffdf5; }
        
        .btn-miele { width: 100%; padding: 14px; background-color: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .btn-miele:hover { background-color: var(--primary-dark); }

        /* SEZIONE LIVE */
        .content-right { flex: 1; display: flex; flex-direction: column; }
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .section-title { font-size: 1.1rem; font-weight: 900; text-transform: uppercase; color: var(--primary-dark); display: flex; align-items: center; gap: 10px; }
        
        .live-badge { background: #22c55e; color: white; font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .grid-quadrants { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; height: 100%; }
        .quadrant-card { background: white; padding: 25px; border-radius: 20px; border: 2px solid #fde68a; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
        .message-text { font-style: italic; color: #451a03; margin-bottom: 15px; font-size: 1rem; }
        .author { font-weight: 800; color: var(--primary-dark); font-size: 0.8rem; text-align: right; }

        @media (max-width: 900px) {
            .main-wrapper { flex-direction: column; }
            .grid-quadrants { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="sidebar-left">
            <div class="header-brand">
                <div class="logo-container"><img src="Logo Ufficiale.jpg" alt="Logo" class="logo-img"></div>
                <h1>Mielangelami</h1>
                <p class="tagline">Il Miele Buono 🍯 — Mangiami</p>
            </div>

            <form id="mieleForm">
                <div class="form-group">
                    <label>La tua Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Il tuo Mielemessaggio 🐝</label>
                    <textarea id="messaggio" required></textarea>
                </div>
                <button type="submit" id="submitBtn" class="btn-miele">Invia & Ricevi il 25%</button>
            </form>
            <div id="successBox" style="display:none; padding:20px; background:#ecfdf5; border-radius:12px; text-align:center;">
                <p>🐝 Grazie! Il tuo messaggio è LIVE.</p>
            </div>
        </div>

        <div class="content-right">
            <div class="section-header">
                <div class="section-title">
                    Mielemessaggi <span class="live-badge">LIVE</span>
                </div>
                <div class="controls-wrapper">
                    <button id="prevBtn" class="btn-miele" style="width: auto; padding: 5px 15px;">&larr;</button>
                    <button id="nextBtn" class="btn-miele" style="width: auto; padding: 5px 15px;">&rarr;</button>
                </div>
            </div>
            <div class="grid-quadrants" id="gridQuadrants"></div>
        </div>
    </div>

    <script>
        let allMessages = [];
        let currentIndex = 0;

        function renderQuadrants() {
            const grid = document.getElementById('gridQuadrants');
            grid.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                const item = allMessages[(currentIndex + i) % allMessages.length];
                if (!item) continue;
                const card = document.createElement('div');
                card.className = 'quadrant-card';
                card.innerHTML = `<div class="message-text">"${item.testo}"</div><div class="author">- ${item.autore}</div>`;
                grid.appendChild(card);
            }
        }

        // Caricamento iniziale
        fetch('testimonianze.json')
            .then(res => res.json())
            .then(data => { allMessages = data; renderQuadrants(); });

        // Invio Form
        document.getElementById('mieleForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const msg = {
                testo: document.getElementById('messaggio').value,
                autore: document.getElementById('email').value.split('@')[0]
            };
            
            // Aggiunta immediata alla visualizzazione LIVE
            allMessages.unshift(msg);
            renderQuadrants();
            
            document.getElementById('mieleForm').style.display = 'none';
            document.getElementById('successBox').style.display = 'block';
        });

        document.getElementById('nextBtn').onclick = () => { currentIndex += 4; renderQuadrants(); };
        document.getElementById('prevBtn').onclick = () => { currentIndex = Math.max(0, currentIndex - 4); renderQuadrants(); };
    </script>
</body>
</html>
