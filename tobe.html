<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Chat - Mielangela</title>
  <style>
    :root {
      --primary-color: #d97706;
      --primary-hover: #b45309;
      --bg-color: #fef3c7;
      --chat-bg: #ffffff;
      --visitor-msg: #f3f4f6;
      --admin-msg: #fef3c7;
      --border-color: #fde68a;
      --text-main: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .chat-card {
      width: 100%;
      max-width: 450px;
      height: 600px;
      background: var(--chat-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .chat-header {
      background: var(--primary-color);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .chat-header .status {
      font-size: 0.8rem;
      opacity: 0.9;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fafafa;
    }

    .chat-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
      display: flex;
      flex-direction: column;
    }

    .chat-bubble.visitor {
      align-self: flex-start;
      background: var(--visitor-msg);
      color: var(--text-main);
      border-bottom-left-radius: 2px;
    }

    .chat-bubble.admin {
      align-self: flex-end;
      background: var(--admin-msg);
      color: #78350f;
      border: 1px solid var(--border-color);
      border-bottom-right-radius: 2px;
    }

    .msg-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.75rem;
      margin-bottom: 4px;
      opacity: 0.75;
      font-weight: 600;
    }

    .msg-text {
      white-space: pre-wrap;
    }

    .chat-footer {
      padding: 12px;
      background: white;
      border-top: 1px solid #f3f4f6;
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 20px;
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    .chat-input:focus {
      border-color: var(--primary-color);
    }

    .send-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: var(--primary-hover);
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="chat-card">
    <div class="chat-header">
      <span style="font-size: 1.5rem;">🐝</span>
      <div>
        <h2>Mielangela Live Chat</h2>
        <div class="status">Rispondiamo il prima possibile</div>
      </div>
    </div>

    <div class="chat-messages" id="chat-messages">
      <!-- I messaggi verranno caricati qui -->
    </div>

    <form class="chat-footer" id="chat-form">
      <input 
        type="text" 
        id="chat-input" 
        class="chat-input" 
        placeholder="Scrivi un messaggio..." 
        autocomplete="off" 
        required
      />
      <button type="submit" class="send-btn" title="Invia">
        <svg viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
        </svg>
      </button>
    </form>
  </div>

  <script>
    const WORKER_URL = 'https://mielangelamichat.agosto.workers.dev';
    const messagesContainer = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');

    // Sanitizzazione stringhe HTML contro attacchi XSS
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // Scarica la cronologia messaggi dal Worker
    async function caricaMessaggi() {
      try {
        const response = await fetch(WORKER_URL);
        if (!response.ok) return;

        const messages = await response.json();
        
        // Mantieni lo scroll se l'utente sta leggendo in alto
        const isAtBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop <= messagesContainer.clientHeight + 50;

        messagesContainer.innerHTML = '';

        messages.forEach(msg => {
          const isAdmin = msg.autore === 'Ape Regina 🐝';
          const bubble = document.createElement('div');
          bubble.className = `chat-bubble ${isAdmin ? 'admin' : 'visitor'}`;
          
          bubble.innerHTML = `
            <div class="msg-meta">
              <span>${escapeHtml(msg.autore)}</span>
              <span>${escapeHtml(msg.ora)}</span>
            </div>
            <div class="msg-text">${escapeHtml(msg.testo)}</div>
          `;
          
          messagesContainer.appendChild(bubble);
        });

        if (isAtBottom) {
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
      } catch (err) {
        console.error('Errore durante il recupero dei messaggi:', err);
      }
    }

    // Invia un nuovo messaggio
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const testo = chatInput.value.trim();
      if (!testo) return;

      chatInput.value = '';

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messaggio: testo, autore: 'Visitatore' })
        });

        if (res.ok) {
          await caricaMessaggi();
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
      } catch (err) {
        console.error('Errore di invio:', err);
      }
    });

    // Avvio e Polling automatico ogni 3 secondi
    caricaMessaggi();
    setInterval(caricaMessaggi, 3000);
  </script>
</body>
</html>
